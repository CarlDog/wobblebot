name: CI & Publish to GHCR

# Quality and the supported Python/platform test matrix both gate publication.
# A local run does not establish hosted CI or Windows acceptance.
#
# Image lands at ghcr.io/carldog/wobblebot with the following tags:
#   :main           — every successful main build (mutable)
#   :latest         — alias for :main (mutable)
#   :sha-<short>    — pinned, never overwritten (use for soak / pinning)
#
# Visibility: package is public so Portainer can pull anonymously without
# any auth config. See docker/README.md for the rationale.

on:
  push:
    branches:
      - main
      - v1.1
    # Release tags (UNI-19). GitHub does not evaluate path filters for tag
    # pushes, so the paths: allowlist below cannot suppress a release build.
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'tools/**'
      - 'docker/Dockerfile'
      - 'docker/entrypoint.sh'
      - 'pyproject.toml'
      - 'requirements*.lock'
      - 'requirements-build.in'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Opt into Node.js 24 ahead of GitHub's forced transition on
  # 2026-06-02. The actions/checkout@v7 + docker/* actions used
  # below already ship Node.js 24-compatible code paths; this
  # exercises them now so any incompatibility surfaces here
  # rather than as a surprise CI failure on the deadline.
  # Remove this line after 2026-06-02 (it becomes the default).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install locked tooling
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: pylint src/
      - run: mypy src/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Tests including historical upgrade gates
        run: python -m pytest
        env:
          WOBBLEBOT_REQUIRE_UPGRADE_GATE: "1"
      - name: Offline component integration
        run: python -m pytest -m integration tests/integration/test_grid_engine_e2e.py tests/integration/test_phase5_operator_e2e.py --no-cov -q

  build-and-push:
    needs: [test, quality]
    # Publish only from main or a release tag — never on a PR, and never from
    # the v1.1 push trigger (which exists to gate tests, not to publish
    # images). The tag arm is what makes UNI-19 releases possible: without it
    # `git push origin v2.0.0` skips this job and publishes nothing.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # UNI-19: a release must not move a mutable deployment tag. `flavor`
          # defaults to latest=auto, which applies :latest on ANY type=semver
          # event -- independently of the type=raw rule below, whose
          # is_default_branch is correctly false on a tag push. Left at the
          # default, `git push origin v2.0.0` republishes :latest from a second
          # build of the same commit, at a different digest, and bounces every
          # stack watching that tag.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=wobblebot
            org.opencontainers.image.description=Deterministic, safety-first micro-trading system using hexagonal architecture
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retain published image identity
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          printf 'revision=%s\nimage_digest=%s\n' "$REVISION" "$IMAGE_DIGEST" > image-identity.txt
          sha256sum requirements.lock >> image-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-identity
          path: image-identity.txt
