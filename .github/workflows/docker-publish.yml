name: CI & Publish to GHCR

# Two jobs, gated:
#   test           — black/isort --check + pylint + mypy + pytest (unit;
#                    schema-drift + filterwarnings=error included). Runs on
#                    every push to main AND v1.1 (the active dev branch —
#                    otherwise development ships ungated), every pull request
#                    (incl. Dependabot bumps), and manual dispatch.
#   build-and-push — needs: test, so a red test job BLOCKS the publish.
#                    Publishes to GHCR only from main (ref-pinned below) via
#                    push / workflow_dispatch, never on PRs and never from
#                    v1.1 — the branch trigger above must not leak :v1.1
#                    images. Closes the "image published from unvalidated
#                    main commit" gap — local pre-commit hooks are bypassable
#                    and don't gate the publish; this does.
#
# Image lands at ghcr.io/carldog/wobblebot with the following tags:
#   :main           — every successful main build (mutable)
#   :latest         — alias for :main (mutable)
#   :sha-<short>    — pinned, never overwritten (use for soak / pinning)
#
# Visibility: package is public so Portainer can pull anonymously without
# any auth config. See docker/README.md for the rationale.

on:
  push:
    branches:
      - main
      - v1.1
    # Release tags (UNI-19). GitHub does not evaluate path filters for tag
    # pushes, so the paths: allowlist below cannot suppress a release build.
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'tools/**'
      - 'docker/Dockerfile'
      - 'pyproject.toml'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Opt into Node.js 24 ahead of GitHub's forced transition on
  # 2026-06-02. The actions/checkout@v7 + docker/* actions used
  # below already ship Node.js 24-compatible code paths; this
  # exercises them now so any incompatibility surfaces here
  # rather than as a surprise CI failure on the deadline.
  # Remove this line after 2026-06-02 (it becomes the default).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags, NOT the default shallow single-commit
          # fetch. tests/deployment/test_v1_to_v2_upgrade_survivor.py
          # builds its fixture from the real tagged schema via
          # `git show v1.0.0:src/.../sqlite_storage_schema.py`, so a
          # shallow checkout makes the 2.0 release gate SKIP — and it
          # did, silently, on the first run of this PR: 3635 passed /
          # 10 skipped in CI against 3645 passed locally, under an
          # all-green check. A skipped gate is an untested gate.
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install (editable + dev extras)
        run: pip install -e ".[dev]"

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Import order (isort)
        run: isort --check-only src/ tests/

      - name: Lint (pylint)
        run: pylint src/

      - name: Type check (mypy)
        run: mypy src/

      - name: Tests (pytest — unit; integration excluded by addopts)
        run: pytest
        env:
          # The v1.0→2.0 upgrade gate must RUN here, not skip. Without
          # this it degrades to a skip whenever the checkout can't reach
          # the v1.0.0 tag, which reads as green. See the comment on the
          # checkout step above.
          WOBBLEBOT_REQUIRE_UPGRADE_GATE: "1"

  build-and-push:
    needs: test
    # Publish only from main or a release tag — never on a PR, and never from
    # the v1.1 push trigger (which exists to gate tests, not to publish
    # images). The tag arm is what makes UNI-19 releases possible: without it
    # `git push origin v2.0.0` skips this job and publishes nothing.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # UNI-19: a release must not move a mutable deployment tag. `flavor`
          # defaults to latest=auto, which applies :latest on ANY type=semver
          # event -- independently of the type=raw rule below, whose
          # is_default_branch is correctly false on a tag push. Left at the
          # default, `git push origin v2.0.0` republishes :latest from a second
          # build of the same commit, at a different digest, and bounces every
          # stack watching that tag.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=wobblebot
            org.opencontainers.image.description=Deterministic, safety-first micro-trading system using hexagonal architecture
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
