# WobbleBot configuration
#
# Copy settings.example.yml to settings.yml and tune for your deployment.
# The example is generic; settings.yml is gitignored and holds operator values.
# Both use the same section order; keys and profile behavior stay schema-aligned.
#
# Loading: --config path -> base YAML -> ONE --profile NAME -> explicit CLI flags.
# Mappings merge recursively; lists replace completely. Values load at startup.
# Trading caps/guards: safety and live/shadow. Cloud budgets: llm. Treasury: harvester.
# Models and fallbacks: advisor plus the selected profile's advisor override.
#
# Secrets and deployment endpoints belong in ENV/.env (Kraken reader/trader/harvester
# keys, provider keys, session secret, KRAKEN_BASE_URL, OLLAMA_BASE_URL). There is no
# exchange YAML section. Existing endpoint/reference fields retain their current behavior.
# Writable DB POLICY is deferred: docs/architecture/adr-044-settings-layout-and-policy-authority.md.
# Today's profiles, CLI overrides and operator-invoked writers still work as before.

# ============================================================================
# 1. Core configuration
# ============================================================================

# Application identity and trading mode (live / shadow / sandbox).
application:
  name: "WobbleBot"
  version: "0.1.0"
  # The deployment's trading mode — the SINGLE source of truth.
  #   live    = real money (cli/live)
  #   shadow  = live prices + synthetic ledger (cli/shadow)
  #   sandbox = mock exchange + paper cycle (cli/sandbox)
  # cli/web reads this for the dashboard mode-badge; Phase 5+ may also
  # gate engine features on it.
  mode: "live"

# Operator-controlled SETTINGS: engine-enforced caps and guards.
# Order-count, exposure, daily BUY spend and inventory caps are six future
# POLICY candidates, static today (ADR-040/044). Guard settings stay static.
# Book/count caps apply to BUYs and SELLs; spend/inventory caps to BUYs only.
# Caps charge the proposed price x quantity, including partial-fill counters.
# Sell-guard deferrals are separate from hard-cap refusals.
safety:
  # Generic TEMPLATE caps — size these to YOUR balance + coin count before
  # going live (two-sided ceiling = coins × levels × order_size; keep
  # max_daily_spend below your free USD). This file is a starting template,
  # not a mirror of any live deployment — your tuned values live in the
  # gitignored settings.yml.
  max_total_exposure_usd: 100.0       # global cap across all coins
  max_daily_spend_usd: 100.0          # BUY-side commits per UTC day
  max_per_coin_exposure_usd: 100.0    # per-coin cap
  max_orders_per_coin: 20             # count cap, per-coin

  # ADR-039 inventory caps: the caps above bound the ORDER BOOK; these
  # bound the POSITION — held inventory at average COST basis plus open
  # BUY notional. Cost, not mark-to-market (an MTM cap re-opens buying
  # as price falls). BUY placement only; a SELL releases headroom and
  # is never blocked. Sells that the ADR-032 guard defers keep their
  # inventory counted here — that pairing is the point: a coin whose
  # sells cannot fire stops accumulating instead of ratcheting.
  max_per_coin_inventory_usd: 40.0
  max_total_inventory_usd: 300.0

  # ADR-032 cost-basis sell guard: defers (never cancels) a SELL whose
  # net-of-fees proceeds fall more than max_loss_percentage below the
  # symbol's replayed average cost basis. Enforced (unlike the retired
  # emergency_stop block) -- every key here is actually read.
  sell_guard:
    enabled: true
    max_loss_percentage: 1.0          # structural floor from fees alone is ~0.80% (Tier-1 doubled 2026-07-09)

  # ADR-025 pre-placement spread guard: skip the whole tick (no order
  # placement attempted) when the symbol's bid-ask spread exceeds this.
  # Default never fires on healthy BTC/ETH (~0.01-0.05%); null disables.
  max_spread_percentage: 1.0

# Grid geometry: coins.* overrides default for that coin only.
# order_size_usd (default/per coin) is the seventh future POLICY candidate,
# static today. Spacing, levels, target mode and enabled flags stay SETTINGS.
grid:
  default:
    # Widened 2026-05-30 from 1.0% -> 3.0% (Stage 8.6). The grid backtest
    # found 1% spacing catastrophic in trends and ~3% the least-bad — its
    # value is downtrend SURVIVAL, not higher profit (per-cycle yield is
    # ~flat across spacings; wider just bleeds less when wrong). Multi-coin
    # runs put every configured alt on this uniform default. Full rationale:
    # docs/reference/grid-strategy-research-synthesis-2026-05-30.md.
    spacing_percentage: 3.0   # delta between adjacent levels, % of reference price
    levels_above: 3           # SELL levels above the anchor
    levels_below: 3           # BUY levels below the anchor
    order_size_usd: 5.0       # USD budget per order; per-pair quantization happens at submit
    # Where a filled BUY's counter SELL goes (ADR-029). `spacing_up` = one
    # step above the fill (classic grid, more + smaller cycles). `top_sell` =
    # the top of the band (sell into strength; fewer + larger cycles). SELL
    # fills always counter one step down in both modes. CAUTION with
    # top_sell: in a grinding downtrend the SELLs cluster at the ceiling and
    # don't fill until a recovery, so base inventory accumulates — see
    # docs/release/v1.0-known-limitations.md. Never auto-applied: the
    # advisor's auto-apply gate only handles numeric keys, so changing this
    # is always an operator edit.
    counter_target_mode: spacing_up

  # Multi-coin runs put every configured alt on the uniform `default` above —
  # no per-coin spacing overrides. Add an entry here only to shadow `default`
  # for one coin; an entry with `enabled: false` SKIPS that coin even if it's
  # listed in a `symbols:` list. (Spacing must exceed 0.80% = 2 × Kraken's
  # 0.40% maker fee, or a cycle loses money on every round trip — the engine
  # validator rejects anything tighter at load.)
  coins:
    DOGE:
      # $6, not the $5 default: Kraken's DOGE ordermin is a fixed 50 DOGE,
      # and at $5 the live volume (order_size_usd / price) fell to 49.99
      # DOGE when DOGE drifted to ~$0.10 (2026-06-02 soak) -> Kraken
      # refused it. $6 clears 50 DOGE up to ~$0.12. Geometry else = default.
      spacing_percentage: 3.0
      levels_above: 3
      levels_below: 3
      order_size_usd: 6.0
      enabled: true

# Shared task cadences. Duration suffixes: s/m/h/d; bare number = seconds.
# 0s disables a scheduled task. Daemons load configuration at startup.
schedules:
  observe_prices: 30s                 # cli/observe: public Ticker poll cadence
  observe_balances: 10m               # cli/observe: private BalanceEx; 0s disables
  news: 30m                           # cli/news: poll every enabled source
  # cli/advise: advisor invocation cadence. 12h is deliberate, not a
  # default — on a wide (3%) grid in a flat regime the advisor's direction
  # does not change between 4h sweeps, so the extra calls buy jitter, not
  # signal. Tighten it if your grid actually cycles.
  advise: 12h
  harvest: 1h                         # cli/harvest (Stage 4.2): balance-monitor cadence
  maintenance_vacuum: 7d              # cli/maintenance (Stage 8.2): VACUUM cadence
  maintenance_prune: 1d               # cli/maintenance: price_snapshots prune+archive cadence
  maintenance_backup: 1d              # cli/maintenance: SQLite .backup cadence
  maintenance_verify: 30d             # cli/maintenance (v1.1): backup restoration smoke test cadence
  maintenance_reconcile: 1d           # cli/maintenance (2026-08-22): Kraken trade-history reconciliation cadence
  maintenance_capital: 1d             # cli/maintenance (ADR-040): capital-viability report cadence
  maintenance_ledger: 1d              # cli/maintenance (ADR-040): exchange-ledger income ingest cadence

# ============================================================================
# 2. Trading, simulation and manual checks
# ============================================================================

# cli/live: real-money trading. Session-loss limits and other guards are
# operator-controlled SETTINGS. Explicit CLI flags override supported values.
live:
  symbols:
    - BTC/USD
  db: "data/wobblebot-live.db"
  tick_seconds: 5.0
  terminal_heartbeat_seconds: 900.0   # how often the "still alive" line prints to the
                                      # terminal/container log. Cosmetic only — trading
                                      # cadence is tick_seconds. Added to this example
                                      # 2026-09-04: the knob has always existed on
                                      # LiveConfig, but was undiscoverable from here.
  max_runtime_minutes: 60.0           # session-level kill switch; ~null~ = run indefinitely
  max_session_loss_usd: 5.0           # mark-to-market portfolio drop (USD) that aborts the session
  # ADR-021: server-side dead man's switch (Kraken CancelAllOrdersAfter),
  # pinged every tick. If cli/live dies (crash, power/network loss),
  # Kraken auto-cancels ALL open orders on the account once this many
  # seconds elapse — fires even when this host is fully dark. ON by
  # default; set ~null~ to disable. Must be >= max(10, 2 x tick_seconds).
  # NOTE: account-wide — also cancels orders you placed manually on the
  # same account.
  dead_mans_switch_seconds: 60
  # ADR-024: after a session-loss-cap exit (exit_code=1), refuse to start
  # a new session for this many minutes -- an immediate restart (operator
  # knee-jerk, or a `restart: unless-stopped` policy) would otherwise
  # re-enter the same losing condition. Scoped to exit_code==1 only;
  # never applies to cli/shadow. Set ~null~ to disable. The terminal-only
  # `--ignore-cool-down` flag bypasses one deliberate restart.
  cool_down_minutes: 60.0
  # How the per-tick sweep is ORDERED (2026-08-15). Sweeping in config
  # order gives the FIRST-LISTED symbol first claim on the exposure and
  # daily-spend caps every tick. Measured in production, the starvation
  # gradient ran straight down the list: ETH (2nd) placed 5/6, SOL (3rd)
  # 2/6, ADA (6th) 0/6 -- and the first-listed symbol had first claim for
  # months.
  #
  # Ordering only redistributes scarcity; it cannot create capacity. If
  # symbols x levels x order_size exceeds your free USD, something starves
  # whatever you choose here -- this only decides WHICH.
  #
  #   config_order  historical behaviour and the DEFAULT, so upgrading
  #                 changes nothing until you opt in. Biased, predictable.
  #   round_robin   rotate the start index by tick. Removes the bias;
  #                 optimises nothing (funds a parked symbol as readily
  #                 as a cycling one). Needs no extra config.
  #   screener      grid-suitability rank (services/screener: volatility
  #                 and ATR%% as distance from a band centre, flatness
  #                 descending), tiebroken by proximity to the nearest
  #                 grid level in ATR. REQUIRES observe_db below.
  symbol_priority: config_order
  # Read-only path to the observe DB. Required ONLY by
  # symbol_priority: screener -- that is where ohlc_bars lives. Left null
  # otherwise so the trading daemon does not take a third DB dependency
  # it has no use for.
  observe_db: null
  log_format: plain                   # plain | json
  # Rotating-file log with daily rotation (7-day retention). Soak-period
  # follow-up (2026-05-25) wired this through every long-running daemon
  # so a silent crash leaves a postmortem trail. Set to null for stderr-
  # only. Default applies even when this line is absent.
  log_file_path: "data/logs/live.log"
  # Stage 5.4: wires cli/live to the operator interaction layer. With
  # this set, cli/live writes session/fill/cap notifications to the
  # notifications table AND polls pending_commands WHERE status='approved'
  # (the ADR-002 firewall). Set to null to run Discord-ignorant.
  operator_db: "data/wobblebot-operator.db"
  # ADR-037 follow-up (2026-08-20 incident): cadence (seconds) for an
  # aggregate "N symbol(s) still paused" reminder while ANY symbol is
  # paused -- a book-vanish hold otherwise pages once and then goes
  # quiet even after 18+ hours. Set to null to disable.
  held_reminder_seconds: 14400.0

# cli/shadow: same engine with live prices and a synthetic ledger.
# Session-loss limits and guards are operator-controlled SETTINGS.
shadow:
  symbols:
    - BTC/USD
  db: "data/wobblebot-shadow.db"
  tick_seconds: 5.0
  max_runtime_minutes: 60.0           # session-level kill switch; ~null~ = run indefinitely
  max_session_loss_usd: 100.0         # synthetic — be generous
  log_format: plain
  log_file_path: "data/logs/shadow.log"  # daily rotation, 7-day retention. null = stderr only.

  # Synthetic balances at session start. Operator-supplied; never
  # inferred from real Kraken (per ADR-008's muscle-memory guard).
  initial_balances:
    USD: 10000
    BTC: 0
    ETH: 0

  # Per-fill fee model. Default rates match Kraken's published
  # Tier-1 (0.40% maker / 0.80% taker, doubled 2026-07-09), confirmed
  # measurement in Phase 2's first-trade receipt.
  maker_fee_rate: 0.0040
  taker_fee_rate: 0.0080

# cli/sandbox: mock exchange and paper cycle; no real Kraken contact.
sandbox:
  db: "data/wobblebot-sim.db"
  log_format: plain

# cli/preflight: one diagnostic engine step using Kraken validate=true.
# Reads grid and safety above; run before a live trading session.
preflight:
  symbol: BTC/USD                     # singular — preflight runs ONE step
  log_format: plain

# cli/status: read-only prices and balances using KRAKEN_READER_API_KEY.
status:
  symbol: BTC/USD
  log_format: plain

# ============================================================================
# 3. Market data and screening
# ============================================================================

# cli/observe: data collection only; no engine, LLM or orders.
# Observe broadly, trade narrowly: symbols are independent of live/shadow.
observe:
  symbols:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - XRP/USD
    - DOGE/USD
    - ADA/USD
    - AVAX/USD
    - LINK/USD
    - DOT/USD
    - POL/USD                          # ex-MATIC; Polygon migrated 2024
    - LTC/USD
    - BCH/USD
  db: "data/wobblebot-observe.db"
  log_format: plain
  log_file_path: "data/logs/observe.log"  # daily rotation, 7-day retention. null = stderr only.

  # v1.1 auto gap-fill (2026-05-25). On daemon startup, observe checks
  # each symbol's most-recent snapshot vs `now`. If the gap is in the
  # [threshold, max] window, it runs a bounded 1m-granularity backfill
  # before entering the poll loop -- restoring coverage lost to a
  # recent outage. Outside the window, gaps are either ignored
  # (smaller than threshold = normal restart) or surfaced as warnings
  # (larger than max = operator should run `cli/observe --backfill
  # --since X` explicitly rather than hammer the API for hours on
  # every restart).
  autogapfill_enabled: true
  autogapfill_threshold_minutes: 10.0   # gaps below this skip silently
  autogapfill_max_hours: 24.0           # gaps above this warn + skip

  # P2 slice 3 follow-up (2026-08-08): steady-state hourly-bar top-up.
  # Once per hour the poll loop resumes each symbol's 60m ohlc_bars
  # from its cursor (a pair with no bars seeds one TA-window's worth),
  # keeping the advisor's TA fields fresh. ~1 Kraken call per symbol
  # per hour; completed bars only.
  bar_topup_enabled: true

  # ADR-037: when set, the balance poll's permanent-auth halt pages
  # the operator (critical notification -> Discord) instead of
  # retrying a dead reader key silently. Null disables the pages;
  # the halt itself still applies.
  operator_db: "data/wobblebot-operator.db"

# cli/news: polls enabled feeds and persists news_items.
# Deduplication is per (source, external_id). Disable a feed with enabled: false.
# CryptoCompare requires a paid subscription and is disabled by default.
news:
  db: "data/wobblebot-news.db"

  rss_feeds:
    - source_id: rss:coindesk
      url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
      enabled: true
    - source_id: rss:decrypt
      url: "https://decrypt.co/feed"
      enabled: true
    - source_id: rss:theblock
      url: "https://www.theblock.co/rss.xml"
      enabled: true
    - source_id: rss:cointelegraph
      url: "https://cointelegraph.com/rss"
      enabled: false                  # noisier; flip on if you want broader coverage
    # Matches the sources Kraken Pro's home-page News widget surfaces;
    # adds first-party Kraken announcements (blog) to the pipeline.
    - source_id: rss:beincrypto
      url: "https://beincrypto.com/feed/"
      enabled: true
    - source_id: rss:coingape
      url: "https://coingape.com/feed/"
      enabled: true
    - source_id: rss:cryptonews
      url: "https://cryptonews.com/news/feed/"
      enabled: true
    - source_id: rss:kraken_blog
      url: "https://blog.kraken.com/feed/"
      enabled: true

  # CryptoCompare News (aggregator). ADR-010's 90-day free-tier
  # evaluation (due 2026-08-13) concluded early: CoinDesk Data (the
  # CryptoCompare rebrand) retired free API access entirely on
  # 2026-05-21, so every fetch now fails with a Type 99 "over your
  # rate limit, upgrade your account" response regardless of poll
  # cadence. Disabled by default — RSS coverage substantially
  # overlaps and is unaffected. Set enabled: true (and get a paid
  # CoinDesk Data plan) if you want this source back.
  cryptocompare:
    enabled: false
    lang: EN
    # categories: "BTC|ETH"            # optional pipe-separated filter

  # Kraken's own exchange-status incident feed (v1.1). Public JSON,
  # no API key -- polls status.kraken.com/api/v2/incidents.json.
  # Enabled by default: an exchange-status incident (API degraded, a
  # coin's deposits/withdrawals halted) is directly relevant to a bot
  # trading on Kraken, unlike general market news.
  kraken_status:
    enabled: true
    base_url: "https://status.kraken.com"

  # Stage 8.4 follow-up: cross-source syndication dedup. Storage's
  # UNIQUE(source, external_id) catches same-source reposts; this
  # block catches the same wire story republished by multiple
  # outlets with reworded headlines. Token-set ratio (rapidfuzz) +
  # mentioned-coins overlap guard.
  dedup:
    # Hours of recent items each candidate is compared against.
    window_hours: 6.0
    # Token-set ratio threshold (0-100). Default 60 measured against
    # real syndicated rewording. Raise to 70 for stricter dedup,
    # lower to 55 for aggressive. Set to 0 to disable (storage-level
    # exact dedup still applies).
    fuzzy_threshold: 60.0

  log_format: plain
  log_file_path: "data/logs/news.log"  # daily rotation, 7-day retention. null = stderr only.
  # P3 slice 2: emit a liveness heartbeat into operator.db each poll
  # cycle. news_items inserts are dedup-gated (a quiet news window
  # writes nothing), so /health and the stale-heartbeat push alert read
  # this beat instead of MAX(fetched_at) — a healthy daemon on a slow
  # news night no longer reads as stale. null = no heartbeats (shows
  # UNKNOWN on the health surfaces).
  operator_db: "data/wobblebot-operator.db"

# cli/screener: offline symbol ranking from stored bars, advisory only.
# Volatility bands reward neither a motionless nor an excessively hot market.
screener:
  db: "data/wobblebot-observe.db"
  lookback_days: 30
  interval_minutes: 60
  vol_band_center: 0.005                # stdev of per-bar returns (fraction)
  atr_band_center_pct: 0.5              # ATR(14) as % of latest close
  log_format: plain

# ============================================================================
# 4. LLM budgets and strategy advisor
# ============================================================================

# Operator-controlled SETTINGS: shared cloud spend caps and retry policy.
# Applies to Anthropic, OpenAI, Google, Atlas and Ollama Cloud, including fallbacks.
# Local Ollama bypasses this cost gate. enforce: false records without denying.
# Omit/null only for a deployment that does not require cloud cost gating.
llm:
  cost:
    # Sliding 24-hour USD cap across all roles + providers. Trips
    # raise LLMCostCapExceeded; the calling CLI catches and skips
    # the call (cli/advise) or posts an operator notification
    # (cli/operator).
    max_spend_per_day_usd: "1.00"
    # Per-CLI-invocation USD cap. In-memory tally, resets per
    # process start. Catches runaway loops that the daily cap
    # wouldn't notice fast enough.
    max_spend_per_session_usd: "0.50"
    # Dry-run kill switch. true = gate enforces; false = gate
    # records calls but never denies (ADR-014 decision 8 — see
    # block-level comment above).
    enforce: true
  retry:
    # Total cloud-LLM call attempts = 1 + max_retries. Transient
    # errors (429 / 5xx / network) retry; permanent (other 4xx)
    # raise immediately. ADR-015 default policy.
    max_retries: 3
    # First retry waits this long; subsequent retries multiply.
    # Defaults give 1s / 2s / 4s for max_retries=3 — total ~7s
    # worst-case retry window.
    initial_backoff_seconds: 1.0
    backoff_multiplier: 2.0

# cli/advise daemon: data sources, storage and sweep options.
# Cadence is schedules.advise; advisor below selects models and behavior.
# Recommendations are advisory only (ADR-002); this daemon never trades.
advise:
  symbols:
    - BTC/USD
    # - ETH/USD       # uncomment to add coverage; cycles run serial
    # - DOGE/USD
  db: "data/wobblebot-advise.db"
  observe_db: "data/wobblebot-observe.db"   # where to read price history
  news_db: "data/wobblebot-news.db"         # where to read news context
  # Where ORDERS live, for the MoE risk expert's exposure + daily-spend
  # inputs. Deliberately NOT observe_db: that file holds prices and zero
  # orders, so reading exposure from it would report $0 against a real
  # cap — "full headroom", the worst possible wrong answer for a risk
  # model. Leave unset and those fields go to the model as null, which
  # risk.md explicitly tells it means "unknown", never zero. Point it at
  # whichever DB your engine writes (live, or shadow for a paper run).
  #
  # ⚠️ THIS IS NOT A RISK-SEAT-ONLY SWITCH. Every advisor adapter
  # serializes the WHOLE PerformanceSummary into its prompt
  # (`summary.model_dump_json()`), so setting this adds seven exposure
  # fields to the input of EVERY role — including the quant seat, which
  # is the only one running in the default profile. `quant.md` does not
  # describe those fields, so the quant model would receive seven
  # unexplained numbers it was never briefed on.
  #
  # Gate it on ONE of these before enabling (verified 2026-08-11):
  #   - the risk seat is actually running (advisor.type: moe with a risk
  #     expert) — i.e. something consumes the fields; or
  #   - `quant.md` gains a line telling the quant judge what the exposure
  #     fields are and whether to weigh them.
  # Until then it buys nothing and perturbs the live advisor's input for
  # no reason, so it ships OFF.
  # orders_db: "data/wobblebot-live.db"
  metrics_lookback_hours: 6                 # window for vol/drawdown/flatness/cycles
  news_lookback_hours: 24                   # 0 disables news in the prompt
  news_match_coin: false                    # true = only news mentioning the symbol's base
  news_limit: 20                            # cap items per cycle (prompt-token budget)
  log_format: plain
  log_file_path: "data/logs/advise.log"     # daily rotation, 7-day retention. null = stderr only.

# Strategy configuration: type single or moe (mixture of experts).
# MoE aggregation: voting, weighted_confidence or arbitrator.
# Cloud providers and Ollama may mix. Seats, fallback order and inference
# parameters remain static SETTINGS; auto_apply bounds are operator-controlled.
# Seat evidence: docs/reference/advisor-seats.md; routing: docs/implementation/llm-fallbacks.md
advisor:
  type: single                        # Base mode. Select `moe` via a profile.

  # Decision engine (Stage 8.5):
  #   llm       — the LLM advisor (single / MoE), per `type`. The default;
  #               pre-8.5 behaviour, no heuristic_file needed.
  #   heuristic — the deterministic HeuristicAdvisorAdapter only ($0, no
  #               LLM). The LLM-target fields below are ignored.
  #   cascade   — heuristic first; escalate to the LLM only on an ambiguous
  #               call; fall back to the heuristic on LLM failure / cost
  #               cap. Recommended for cloud-LLM setups (most ticks cost $0).
  # `heuristic` and `cascade` require `heuristic_file`.
  engine: cascade
  heuristic_file: "config/heuristic/quant.yml"

  # Cadence lives in the core `schedules:` block near the top of this file
  # (key: `advise`), alongside every other periodic-task interval.

  # Single-mode LLM target. Required when type=single (and engine is llm/cascade).
  # `ollama_cloud` uses https://ollama.com/api/chat and OLLAMA_API_KEY.
  # It is metered cloud usage, subject to llm.cost caps and llm.retry settings.
  # Supported initial models: gpt-oss:120b, gpt-oss:20b, qwen3.5:397b, gemma4:31b.
  # For an evaluated primary or fallback, set provider: ollama_cloud and its model.
  # Keep this role's prompt; tune inference_params per model. No -cloud suffix.
  # Setup, example and limits: docs/implementation/ollama-cloud.md
  # ollama | ollama_cloud | anthropic | openai | google | atlas.
  # `atlas` (2026-08-12) is Atlas Cloud, an OpenAI-COMPATIBLE gateway
  # fronting ~400 models — it reuses the OpenAI adapter with a base_url
  # override, needs ATLASCLOUD_API_KEY, and its models carry a vendor
  # prefix (`xai/grok-4.5`). It exists because base_url was configurable
  # only for ollama, so a seat the batteries had CHOSEN could not be
  # NAMED here. Cost rows record provider `openai`, which is how
  # services/llm_pricing keys the Atlas roster.
  provider: ollama
  model: deepseek-r1:7b
  prompt_file: "config/prompts/quant.md"
  # Preselected quant: equivalent cloud first, previous cloud backup last; disabled.
  # No verified equivalent on a different cloud route; skip that slot.
  # Final cloud: weaker calibration; reconcile 62/63 outcomes; shares Atlas with Grok.
  # Cloud chain failure uses the heuristic; next scheduled evaluation retries primary.
  # Evidence: docs/reference/advisor-seats.md#fallback-candidates
  # After validation, replace the active [] line with this block:
  # fallbacks:
  # - provider: atlas
  #   model: deepseek-ai/deepseek-v4-pro
  #   inference_params:
  #     temperature: 1.0
  #     max_tokens: 4000
  #     timeout_seconds: 300
  fallbacks: []
  inference_params:
    temperature: 0.5
    max_tokens: 512                   # bump to 2048 for thinking models (R1, o1) —
                                      # they need room for <think> + the JSON answer
    timeout_seconds: 60               # bump to 180+ for 70B-class models or any
                                      # thinking model whose chain-of-thought is long

  # Bounded auto-tuning. Off by default. Per ADR-007, news-derived
  # recommendations NEVER auto-apply regardless of these bounds —
  # only metrics-driven (quant, risk) suggestions are eligible.
  auto_apply:
    enabled: false
    max_spacing_change_percentage: 20.0
    max_order_size_change_percentage: 15.0

  # Chaos Gremlin (P4.4c) — a standalone loose-reasoning voice that rides
  # beside the main advisor: same metrics, but it emits a falsifiable
  # DIRECTIONAL call ({direction: up|down|chop, horizon_hours}) that the
  # outcome ledger grades against the realized move (ADR-035). Its role is
  # firewalled: never auto-applied, never fed to the MoE arbitrator. Off by
  # default; free when provider is ollama. min_interval_minutes cooldown-gates
  # emission per symbol (240 = ~6 calls/day/symbol at any advise cadence).
  gremlin:
    enabled: false
    provider: ollama
    model: "qwen2.5:3b-instruct-q4_K_M"
    prompt_file: "config/prompts/gremlin.md"
    inference_params:
      temperature: 1.0                # runs hot on purpose — the leap is the charter
      max_tokens: 512
      timeout_seconds: 60.0
    min_interval_minutes: 240

# ============================================================================
# 5. Treasury
# ============================================================================

# cli/harvest daemon: treasury polling and storage; cadence is schedules.harvest.
# harvester below sets thresholds and execution gates. Proposals persist
# even when execution is disabled. Only Harvester can transfer funds (ADR-003).
harvest:
  db: "data/wobblebot-harvest.db"       # transfer_proposals lands here
  log_format: plain                     # plain | json
  log_file_path: "data/logs/harvest.log"  # daily rotation, 7-day retention. null = stderr only.
  # Stage 5.5: wires cli/harvest to the notifications table so proposal
  # generated / withdrawal failed / withdrawal executed events surface
  # to Discord via cli/operator's forwarder. Set to null to run silent.
  operator_db: "data/wobblebot-operator.db"

# Operator-controlled SETTINGS: treasury thresholds, outflow caps and destinations.
# min_exchange_liquidity_usd < topup_threshold_usd < surplus_threshold_usd.
# enabled gates execution; Kraken withdrawal credentials are separate ENV secrets.
harvester:
  enabled: false
  min_exchange_liquidity_usd: 200.0
  topup_threshold_usd: 250.0
  surplus_threshold_usd: 500.0
  max_withdrawal_per_day_usd: 1000.0
  # Stage 4.4 fields (operational; safe to leave as defaults until execute lands).
  # Per ADR-003 the Harvester key has Withdraw + Query Funds scopes ONLY —
  # NOT Create/Modify/Cancel orders (that's the trade key's territory).
  api_key_env_var: KRAKEN_HARVESTER_API_KEY
  api_secret_env_var: KRAKEN_HARVESTER_API_SECRET
  # Asset → destination-label mapping. The label MUST already exist in
  # Kraken Pro → Funding → Withdraw → New Address (or New Wire Recipient).
  # Kraken's withdrawal API only accepts labels from the operator's
  # pre-registered address book — there's no API path for arbitrary
  # recipients, by design. The Stage 4.4c `cli/harvest --execute` path
  # refuses every withdrawal whose asset has no entry here.
  #
  # Operator: replace these placeholders with your real Kraken Pro
  # destination labels (or remove the asset entirely if you don't want
  # withdrawals enabled for it).
  withdrawal_destinations:
    USD: "<your-bank-label>"              # bank ACH/wire recipient label
    # BTC: "btc-coldstorage-1"            # crypto address label (uncomment as needed)
  # --execute refuses any proposal older than this; defends against
  # operator approving stale proposals where balance/threshold context
  # has drifted since the proposal was generated.
  proposal_max_age_hours: 24

# ============================================================================
# 6. Operator surfaces and maintenance
# ============================================================================

# cli/operator: Discord interface. Queries answer immediately; commands enter
# pending_commands and require approval before execution (ADR-002/013).
# Authorization, assistant settings and command TTLs remain SETTINGS.
operator:
  auth:
    # Discord bot token env-var name. The actual token never appears in
    # this file — it lives in .env (gitignored). Leave the env-var name
    # if the default works; override only if you maintain multiple bots
    # in the same .env.
    bot_token_env_var: DISCORD_BOT_TOKEN
    # Whitelist of Discord user IDs allowed to send the bot commands +
    # confirm pending actions. Empty = deny everyone (no one can use the
    # bot). Find a user's ID by right-clicking their name with Discord
    # developer mode enabled.
    allowed_user_ids: []
    # Whitelist of Discord channel IDs the bot listens in. Empty = deny
    # all channels. Find a channel's ID by right-clicking the channel
    # with developer mode enabled.
    allowed_channel_ids: []
    # Where outbound notifications + confirmation embeds post. MUST be
    # in allowed_channel_ids — the daemon validates at startup.
    outbound_channel_id: "<your-discord-channel-id>"
  assistant:
    # LLM provider for intent parsing. Phase 5 ships ollama only;
    # Phase 6 will add anthropic / openai / google.
    provider: ollama
    # Ollama model tag. phi4:14b-q8_0 is the operator's empirical
    # default for conversational intent parsing (decent accuracy on
    # the operator_intent_v1 schema; ~2-4s latency on a hobby box).
    model: phi4:14b-q8_0
    # Path to the operator prompt file. Ships at config/prompts/operator.md;
    # operators edit freely — the only mechanical contract is the
    # frontmatter declaring `role: operator` and
    # `response_schema: operator_intent_v1`.
    prompt_file: config/prompts/operator.md
    base_url: http://localhost:11434
    # Lower temperature than the advisor's 0.5 — intent parsing
    # benefits from determinism. Bump if responses get too rigid.
    temperature: 0.3
    max_tokens: 512
    timeout_seconds: 60.0
  # Path to the daemon's own SQLite DB. Houses three tables:
  # pending_commands (Stage 5.4), notifications (Stage 5.5), and
  # conversation_turns (Stage 5.6).
  operator_db: "data/wobblebot-operator.db"
  # Optional paths to other CLIs' DBs. When set, cli/operator can
  # answer queries that need data from those scopes (recent advisor
  # suggestions, recent news headlines, harvester status / recent
  # proposals). When unset, those queries return empty results —
  # graceful degrade.
  live_db: "data/wobblebot-live.db"
  advise_db: "data/wobblebot-advise.db"
  news_db: "data/wobblebot-news.db"
  harvest_db: "data/wobblebot-harvest.db"
  # observe.db powers the StatusQuery's USD-balance lookup (the
  # balance_snapshots table lives only in observe.db, populated by
  # cli/observe's optional balance-polling cadence). Unwired → the
  # Discord StatusQuery's "USD balance" reports 0.0; everything else
  # (symbols, session_pnl from cycle_matcher, recent_fill_count)
  # still works.
  observe_db: "data/wobblebot-observe.db"
  # ADR-013 decision 5: 10-turn multi-turn context window. Capped at
  # 1-50 by the schema. Higher values give the LLM more history but
  # cost more tokens per call.
  context_window_turns: 10
  # ADR-013 decision 3: confirmation TTL. After this many seconds
  # without an operator confirm/reject reaction, an
  # awaiting_confirmation row transitions to 'expired' via the
  # daemon's background TTL expirer.
  confirm_ttl_seconds: 300
  # Notification forwarder poll cadence. Lower = faster Discord
  # surfacing; higher = less CPU + DB load.
  forwarder_poll_seconds: 2.0
  # P3 slice 2: canonical daemon names (e.g. "cli/harvest") the
  # stale-heartbeat push alert must NOT alert on — for daemons you have
  # deliberately taken down. Muting silences the Discord push only;
  # /health keeps showing the true freshness state. (Deliberately not
  # keyed off harvester.enabled — that flag gates withdrawal execution,
  # and the harvest daemon legitimately runs proposals-only with it off.)
  heartbeat_alert_mute: []
  # TTL expirer poll cadence. Doesn't need to be fast — the operator's
  # expectation is "wait a minute, maybe two".
  ttl_expirer_poll_seconds: 30.0
  # On startup, pull the last N messages from each allowlisted channel
  # via Discord's read_message_history permission and persist any
  # not-yet-seen ones to conversation_turns. Lets the LLM regain
  # recent operator context after a daemon restart. Set to 0 to
  # disable. Bounded 0-100 by the schema.
  history_backfill_messages: 20
  log_format: plain                       # plain | json
  log_file_path: "data/logs/operator.log" # daily rotation, 7-day retention. null = stderr only.

# cli/web: dashboard and approval surfaces. /settings stores only user preferences
# such as timezone in the DB; it does not edit this file or trading policy.
# Auth/session controls are operator-controlled SETTINGS; session secret is ENV.
web:
  # ---- serving ----
  # 127.0.0.1 = loopback-only. Operator runs their reverse proxy in
  # front for TLS + LAN exposure. Set 0.0.0.0 only if the host is
  # already firewalled and TLS is terminated elsewhere.
  bind_host: 127.0.0.1
  bind_port: 8000
  # ---- session / auth (ADR-017) ----
  # Env var holding the cookie-signing key. Never the key itself —
  # the key lives in .env (gitignored).
  session_secret_env_var: WOBBLEBOT_WEB_SESSION_SECRET
  # Sliding session lifetime. Cookie expires after this many days of
  # inactivity. 1-90 enforced by the schema.
  session_max_age_days: 7
  # Per-IP login attempts allowed in `rate_limit_window_seconds`
  # before further attempts return 429. 1-100 enforced.
  rate_limit_attempts: 5
  rate_limit_window_seconds: 60
  # Bcrypt cost factor for new password hashes. 12 is the ADR-017
  # default. Bump to 13 / 14 if the operator's hardware warrants;
  # 10-15 enforced.
  bcrypt_cost: 12
  # ---- presentation ----
  # HTMX polling cadence for the cost ledger + open-orders cards.
  # Static-ish pages (news, audit log) ignore this — they're
  # full-reload-on-navigation.
  htmx_poll_seconds: 15.0
  # Lowest re-anchor banner severity that earns a banner on the
  # dashboard: mild | moderate | strong. Default `mild` shows every
  # finding. Raise it to quiet routine drift.
  #
  # This is safe ONLY because severity self-escalates on AGE: the tier
  # is max(drift_tier, age_tier), and age alone reaches moderate at 48h
  # and strong at 72h. So a filtered finding is delayed, not dropped —
  # if the drift persists it re-appears one tier up. That matters
  # because the banner is the ONLY surface a re-anchor recommendation
  # reaches (no notification event, no Discord message, and the
  # heuristic advisor doesn't emit one).
  reanchor_min_severity: mild
  # External Kraken account URL surfaced as a header link for
  # one-click access. Default lands on Kraken Pro's account home;
  # operators in non-US regions or who prefer the trade view may
  # override. Set to null to suppress the link entirely.
  kraken_account_url: "https://pro.kraken.com/app/home"
  # v1.1 footer "update available" indicator. Polls GitHub's public
  # releases API from the SERVER (never the browser) on this cadence.
  # Default on; set to false for zero outbound calls.
  release_check_enabled: true
  release_check_interval_hours: 6.0
  # P4.7 cost-honesty card: your honest estimate of monthly infra cost
  # (electricity + hardware amortization + anything paid outside Kraken
  # and the LLM providers). null = undeclared — the card computes net
  # WITHOUT infra and says so. A declared 0.0 is a real statement.
  cost_assumptions:
    monthly_infra_usd: null
  # ---- cross-DB paths ----
  # operator.db is REQUIRED (users table + pending_commands +
  # notifications + llm_calls). The other four are optional per the
  # OperatorService graceful-degrade pattern (Stage 5.6.C) — cards
  # that need the missing DB don't render.
  operator_db: "data/wobblebot-operator.db"
  live_db: "data/wobblebot-live.db"
  advise_db: "data/wobblebot-advise.db"
  harvest_db: "data/wobblebot-harvest.db"
  observe_db: "data/wobblebot-observe.db"
  news_db: "data/wobblebot-news.db"
  log_format: plain                       # plain | json
  log_file_path: "data/logs/web.log"      # daily rotation, 7-day retention. null = stderr only.

# cli/maintenance: vacuum, prune/archive, backup, verify, reconcile, capital
# and ledger tasks, with cadences in schedules. Reads live.symbols for reconciliation.
# Retention, paths and task controls remain operator-controlled SETTINGS.
maintenance:
  # Every DB the daemon should VACUUM + back up. Add the operator's
  # active DBs; missing files are skipped (logged WARNING) so partial
  # deployments work.
  target_dbs:
    - "data/wobblebot-live.db"
    - "data/wobblebot-shadow.db"
    - "data/wobblebot-operator.db"
    - "data/wobblebot-observe.db"
    - "data/wobblebot-advise.db"
    - "data/wobblebot-harvest.db"
    - "data/wobblebot-news.db"

  # Snapshots older than this many days get archived + deleted.
  # Default 30 matches the typical advisor-metrics rolling window.
  prune_price_snapshots_older_than_days: 30

  # Source DB for the prune task. Typically observe.db (where
  # cli/observe writes the price tape). The maintenance daemon
  # won't infer this — set it explicitly.
  prune_source_db: "data/wobblebot-observe.db"

  # Where pruned snapshots are archived BEFORE delete. Created if
  # missing. CSV format with stable header; new archives write
  # gzipped (.csv.gz) since ADR-036.
  archive_dir: "data/archive"

  # ADR-036 per-table retention horizons (days). Rows older than the
  # horizon are archived (gzipped CSV in archive_dir) then deleted, on
  # the maintenance_prune cadence. Only tables in the code-side
  # prunable registry may appear here (news_items / conversation_turns
  # / notifications); an unknown name refuses to boot, and forensic
  # tables (orders, trades, transfer_*, pending_commands, ...) are not
  # prunable at all. Remove a line (or the whole block) to keep that
  # table forever. 90 is the ADR-036 ratified default for all three.
  retention:
    news_items: 90
    conversation_turns: 90
    notifications: 90

  # Home DB for the news_items retention entry (conversation_turns +
  # notifications resolve via operator_db below).
  news_db: "data/wobblebot-news.db"

  # Source DB for the reconcile task's local trade history --
  # typically live.db (where cli/live records fills). Same
  # explicit-over-inferred rule as prune_source_db. Symbols come from
  # live.symbols above (the actually-traded set), not a separate list
  # here, so this task can never drift from what's actually traded.
  # Unset disables the task entirely (e.g. a sandbox/shadow-only
  # deployment with no real Kraken trading has nothing for it to
  # check) -- NB an operator settings.yml written before 2026-08-22
  # won't have this key, so add it there explicitly or the daily
  # check silently never runs.
  reconcile_source_db: "data/wobblebot-live.db"

  # Where SQLite .backup output goes. Created if missing.
  backup_dir: "data/backups"

  # Newest N backups per source DB are kept; older ones are deleted
  # after each successful backup write.
  keep_n_daily_backups: 7

  # ADR-036 same-day dedupe: skip a DB's backup when its newest backup
  # is younger than this many hours. The backup task fires on daemon
  # start, so restart-heavy days would otherwise burn several
  # keep_n_daily slots on near-identical copies. 0 = back up every
  # cycle unconditionally.
  min_backup_interval_hours: 20.0

  log_format: plain                       # plain | json
  log_file_path: "data/logs/maintenance.log"  # daily rotation, 7-day retention. null = stderr only.

  # Stage 8.4.E follow-up — when set, cli/maintenance opens operator.db
  # and writes a daemon_heartbeat row at the top of each scheduled
  # task so the web UI's /health page can see the daemon is alive.
  # Without this, /health shows cli/maintenance as UNKNOWN.
  operator_db: "data/wobblebot-operator.db"

# ============================================================================
# 7. Named profile overlays
# ============================================================================

# Select ONE with --profile NAME; mappings merge and lists replace entirely.
# Profiles are not composable. Explicit supported CLI flags take precedence.
# conservative / aggressive: risk and grid geometry overlays.
# moe-advisor: local Ollama committee; cloud-only-moe: cloud committee.
# cpu-only: CPU host configuration; still uses a cloud advisor with cascade.
# Inspect the selected profile for effective seats, budgets and safety overrides.
# For MoE, keep base advisor.fallbacks empty; enable only expert/arbitrator lists.
profiles:

  # Risk/geometry overlay with lower exposure and session limits.
  # Inspect its effective spacing against the base before use.
  conservative:
    grid:
      default:
        spacing_percentage: 2.0
        levels_above: 2
        levels_below: 2
    safety:
      max_total_exposure_usd: 50.0
      max_daily_spend_usd: 30.0
    live:
      max_session_loss_usd: 2.0
      max_runtime_minutes: 30.0
    shadow:
      max_session_loss_usd: 50.0
      initial_balances:
        USD: 1000

  # More levels and looser caps; evaluate in shadow before live use.
  # Tighter spacing can increase trend losses; see
  # docs/reference/grid-strategy-research-synthesis-2026-05-30.md.
  aggressive:
    grid:
      default:
        spacing_percentage: 1.8        # must clear the 0.80% fee floor (2x maker; Kraken Tier-1 doubled 2026-07-09)
        levels_above: 5
        levels_below: 5
        order_size_usd: 20.0
    safety:
      max_total_exposure_usd: 500.0
      max_daily_spend_usd: 200.0
    live:
      max_session_loss_usd: 10.0
      max_runtime_minutes: 120.0
    shadow:
      max_session_loss_usd: 200.0
      initial_balances:
        USD: 50000
        BTC: 1
        ETH: 5

  # Local Ollama committee. These tags are examples, NOT qualified seat holders.
  # Install the matching tags and evaluate each against its current role prompt.
  # Reconcile docs/reference/advisor-seats.md before using a live seat.
  # aggregator=arbitrator requires the arbitrator block below.
  moe-advisor:
    advisor:
      type: moe
      aggregator: arbitrator

      arbitrator:
        provider: ollama
        model: phi4:14b-q8_0
        prompt_file: "config/prompts/arbitrator.md"
        # Preselected arbitrator: equivalent cloud first, previous cloud backup last; disabled.
        # No verified equivalent on a different cloud route; skip that slot.
        # Final cloud: 73/75; both misses violated never-tighten.
        # Cloud chain failure uses the heuristic; next scheduled evaluation retries primary.
        # Evidence: docs/reference/advisor-seats.md#fallback-candidates
        # After validation, replace the active [] line with this block:
        # fallbacks:
        # - provider: openai
        #   model: gpt-5-mini
        #   inference_params:
        #     temperature: 1.0
        #     max_tokens: 4000
        #     timeout_seconds: 300
        fallbacks: []
        inference_params:
          temperature: 0.3
          max_tokens: 1024
          timeout_seconds: 180

      experts:
        - name: quant
          provider: ollama
          model: phi4:14b-q8_0
          role: quant
          prompt_file: "config/prompts/quant.md"
          # Preselected quant: equivalent cloud first, previous cloud backup last; disabled.
          # No verified equivalent on a different cloud route; skip that slot.
          # Final cloud: weaker calibration; reconcile 62/63 outcomes; shares Atlas with Grok.
          # Cloud chain failure uses the heuristic; next scheduled evaluation retries primary.
          # Evidence: docs/reference/advisor-seats.md#fallback-candidates
          # After validation, replace the active [] line with this block:
          # fallbacks:
          # - provider: atlas
          #   model: deepseek-ai/deepseek-v4-pro
          #   inference_params:
          #     temperature: 1.0
          #     max_tokens: 4000
          #     timeout_seconds: 300
          fallbacks: []
          inference_params:
            temperature: 0.5
            max_tokens: 512
            timeout_seconds: 120
        - name: risk
          provider: ollama
          model: qwen3:8b
          role: risk
          prompt_file: "config/prompts/risk.md"
          # Preselected risk: equivalent cloud first, previous cloud backup last; disabled.
          # No verified equivalent on a different cloud route; skip that slot.
          # Final cloud: 52/54 OK, zero UNSAFE; still requires role validation.
          # Cloud chain failure uses the heuristic; next scheduled evaluation retries primary.
          # Evidence: docs/reference/advisor-seats.md#fallback-candidates
          # After validation, replace the active [] line with this block:
          # fallbacks:
          # - provider: atlas
          #   model: deepseek-ai/deepseek-v4-pro
          #   inference_params:
          #     temperature: 0.4
          #     max_tokens: 4000
          #     timeout_seconds: 300
          fallbacks: []
          inference_params:
            temperature: 0.4
            max_tokens: 512
            timeout_seconds: 120
        - name: news
          provider: ollama
          model: deepseek-r1:8b
          role: news
          prompt_file: "config/prompts/news.md"
          # Preselected news: equivalent cloud first, previous cloud backup last; disabled.
          # No verified equivalent on a different cloud route; skip that slot.
          # Final cloud: 66/66 news; a ceiling tie, not proof it beats the incumbent.
          # Cloud chain failure uses the heuristic; next scheduled evaluation retries primary.
          # Evidence: docs/reference/advisor-seats.md#fallback-candidates
          # After validation, replace the active [] line with this block:
          # fallbacks:
          # - provider: atlas
          #   model: xai/grok-4.5
          #   inference_params:
          #     temperature: 0.6
          #     max_tokens: 4000
          #     timeout_seconds: 300
          fallbacks: []
          inference_params:
            temperature: 0.6
            max_tokens: 2048               # R1 needs room for <think> + JSON
            timeout_seconds: 180

  # Cloud committee; requires llm cost configuration and each selected
  # provider's API key in ENV, including keys for enabled cloud fallbacks.
  # Reconcile tags/evidence with docs/reference/advisor-seats.md before use.
  # Profile contents alone do not establish which profile is deployed.
  cloud-only-moe:
    advisor:
      type: moe
      aggregator: arbitrator

      arbitrator:
        provider: anthropic
        model: claude-sonnet-4-6
        prompt_file: "config/prompts/arbitrator.md"
        # Preselected arbitrator: equivalent cloud first, previous cloud backup last; disabled.
        # First: nominal equivalent via Atlas; catalog is_ready=false, verify before enabling.
        # Final cloud: 73/75; both misses violated never-tighten.
        # Cloud chain failure uses the heuristic; next scheduled evaluation retries primary.
        # Evidence: docs/reference/advisor-seats.md#fallback-candidates
        # After validation, replace the active [] line with this block:
        # fallbacks:
        # - provider: atlas
        #   model: anthropic/claude-sonnet-4.6
        #   inference_params:
        #     temperature: 1.0
        #     max_tokens: 4000
        #     timeout_seconds: 300
        # - provider: openai
        #   model: gpt-5-mini
        #   inference_params:
        #     temperature: 1.0
        #     max_tokens: 4000
        #     timeout_seconds: 300
        fallbacks: []
        inference_params:
          temperature: 0.3
          max_tokens: 1024

      experts:
        - name: claude
          provider: anthropic
          model: claude-sonnet-4-6
          role: quant
          prompt_file: "config/prompts/quant.md"
          # Preselected quant: equivalent cloud first, previous cloud backup last; disabled.
          # First: nominal equivalent via Atlas; catalog is_ready=false, verify before enabling.
          # Final cloud: weaker calibration; reconcile 62/63 outcomes; shares Atlas with Grok.
          # Cloud chain failure uses the heuristic; next scheduled evaluation retries primary.
          # Evidence: docs/reference/advisor-seats.md#fallback-candidates
          # After validation, replace the active [] line with this block:
          # fallbacks:
          # - provider: atlas
          #   model: anthropic/claude-sonnet-4.6
          #   inference_params:
          #     temperature: 1.0
          #     max_tokens: 4000
          #     timeout_seconds: 300
          # - provider: atlas
          #   model: deepseek-ai/deepseek-v4-pro
          #   inference_params:
          #     temperature: 1.0
          #     max_tokens: 4000
          #     timeout_seconds: 300
          fallbacks: []
          inference_params:
            temperature: 0.5
            max_tokens: 512
        - name: gpt
          provider: openai
          model: gpt-4o
          role: risk
          prompt_file: "config/prompts/risk.md"
          # Preselected risk: equivalent cloud first, previous cloud backup last; disabled.
          # No verified equivalent on a different cloud route; skip that slot.
          # Final cloud: 52/54 OK, zero UNSAFE; still requires role validation.
          # Cloud chain failure uses the heuristic; next scheduled evaluation retries primary.
          # Evidence: docs/reference/advisor-seats.md#fallback-candidates
          # After validation, replace the active [] line with this block:
          # fallbacks:
          # - provider: atlas
          #   model: deepseek-ai/deepseek-v4-pro
          #   inference_params:
          #     temperature: 0.4
          #     max_tokens: 4000
          #     timeout_seconds: 300
          fallbacks: []
          inference_params:
            temperature: 0.4
            max_tokens: 512
        - name: gemini
          provider: google
          model: gemini-2.0-flash
          role: news
          prompt_file: "config/prompts/news.md"
          # Preselected news: equivalent cloud first, previous cloud backup last; disabled.
          # No verified equivalent on a different cloud route; skip that slot.
          # Final cloud: 66/66 news; a ceiling tie, not proof it beats the incumbent.
          # Cloud chain failure uses the heuristic; next scheduled evaluation retries primary.
          # Evidence: docs/reference/advisor-seats.md#fallback-candidates
          # After validation, replace the active [] line with this block:
          # fallbacks:
          # - provider: atlas
          #   model: xai/grok-4.5
          #   inference_params:
          #     temperature: 0.6
          #     max_tokens: 4000
          #     timeout_seconds: 300
          fallbacks: []
          inference_params:
            temperature: 0.6
            max_tokens: 512

  # CPU host: small local operator assistant plus a single cloud advisor.
  # Cascade resolves clear heuristic guards and escalates other calls to the
  # configured cloud model; requires llm and that provider's ENV credentials.
  # The assistant's base_url must be reachable from its container; advisor
  # Ollama wiring uses OLLAMA_BASE_URL. This profile does not mean offline.
  cpu-only:
    operator:
      assistant:
        provider: ollama
        model: qwen2.5:1.5b-instruct-q4_K_M
        prompt_file: config/prompts/operator.md
        base_url: http://host.docker.internal:11434
        temperature: 0.3
        max_tokens: 512
        timeout_seconds: 60.0
    advisor:
      engine: cascade
      heuristic_file: "config/heuristic/quant.yml"
      # Escalation target for every non-guard tick (and the fallback's
      # "what the LLM would have said" when it errors / hits the cost cap).
      # The heuristic only resolves the clear guard cases now (ADR-022).
      type: single
      provider: openai
      model: gpt-5-mini
      prompt_file: "config/prompts/quant.md"
      # Preselected quant: equivalent cloud first, previous cloud backup last; disabled.
      # No verified equivalent on a different cloud route; skip that slot.
      # Final cloud: weaker calibration; reconcile 62/63 outcomes; shares Atlas with Grok.
      # Cloud chain failure uses the heuristic; next scheduled evaluation retries primary.
      # Evidence: docs/reference/advisor-seats.md#fallback-candidates
      # After validation, replace the active [] line with this block:
      # fallbacks:
      # - provider: atlas
      #   model: deepseek-ai/deepseek-v4-pro
      #   inference_params:
      #     temperature: 1.0
      #     max_tokens: 4000
      #     timeout_seconds: 300
      fallbacks: []
      inference_params:
        temperature: 1.0       # gpt-5-mini is a reasoning model — it ignores low temps
        # 4000 covers the model's hidden reasoning tokens + the JSON answer
        # (reasoning shares the completion budget).
        max_tokens: 4000
        timeout_seconds: 120
